# Reverse proxy: web (SvelteKit) + Martin (vector tiles) sotto un'unica origine.
# Niente CORS perché il browser parla solo con questo host: le tile passano da /tiles/.

server {
    listen 80;
    server_name _;

    # corpo richieste (POST segnalazioni è piccolo, ma diamo margine)
    client_max_body_size 2m;

    # Vector tiles → Martin. La slash finale in proxy_pass toglie il prefisso /tiles/:
    #   /tiles/road_segments/10/1/1  ->  martin:3000/road_segments/10/1/1
    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
    }

    # Tutto il resto → SvelteKit (adapter-node)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
